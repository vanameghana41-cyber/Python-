<!DOCTYPE html>
<html>
<head>
    <title>Quiz Competition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>QUIZ COMPETITION</h1>

    <div class="info-box">
        <h2>Welcome to Quiz Competition</h2>

        <p>
            This quiz contains questions from:
        </p>

        <ul>
            <li>Java Programming (8 Questions)</li>
            <li>General Knowledge (8 Questions)</li>
            <li>Aptitude (8 Questions)</li>
        </ul>

        <p><b>Total Questions : 24</b></p>

        <p>
            Each correct answer carries 1 mark.
            Test your knowledge and improve your skills.
        </p>
    </div>

    <h3 id="question-number"></h3>

    <h2 id="question"></h2>

    <div id="options"></div>

    <p id="message"></p>

    <button id="next-btn">Next Question</button>

    <h2 id="result"></h2>

</div>

<script src="script.js"></script>

</body>
</html>
